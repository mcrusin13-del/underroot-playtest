/* Mobile-first interface pass: larger controls, scrollable navigation, readable combat cards. */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
button,select{touch-action:manipulation}
button:active:not(:disabled){transform:scale(.985)}
nav{position:relative;min-width:0}
nav button{white-space:nowrap;flex-shrink:0}
.campaign-path{position:relative}
.campaign-path .encounter{position:relative}
.campaign-path .encounter:not(:last-child):after{content:'';position:absolute;left:27px;bottom:-9px;height:9px;width:2px;background:var(--line)}
.campaign-path .encounter:disabled{opacity:.55}
.campaign-path .encounter.selected{box-shadow:inset 3px 0 var(--gold)}
.victory-rewards{margin:0 0 20px;border-color:var(--gold);background:linear-gradient(145deg,#3d3322,#1b2920)}
.victory-rewards h2{color:var(--gold)}
.creature-detail{min-width:0}
.creature-detail button{margin:3px 4px 3px 0}
.creature-detail select{width:100%}
.collection-card[aria-pressed="true"]{border-color:var(--gold);background:#283528}
.combat-card .health{height:8px;margin-top:10px}
.combat-card .statuses b{display:inline-block;font-size:10px;margin:2px 3px;padding:1px 4px;border:1px solid #84734a;border-radius:4px}
@media(max-width:700px){
 body{font-size:15px;line-height:1.5}
 .shell{padding:0 12px}
 header{padding:12px 0}
 .edition{display:none}
 nav{gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:2px}
 nav button{min-height:48px;padding:11px 12px;font-size:13px}
 nav span{display:none}
 .intro{padding:22px 0 16px}
 h1{font-size:clamp(31px,9vw,43px)}
 .panel{padding:14px;border-radius:11px}
 .layout,.arena{gap:12px}
 .controls{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .controls button,.controls select{font-size:14px;min-height:48px;padding:10px 8px}
 .controls .target-picker{grid-column:1 / -1;font-size:12px}
 .controls .tag{align-self:center;text-align:center;padding:10px 6px;font-size:12px}
 .battle-heading{padding:20px 0 12px;gap:10px}
 .battle-heading h1{font-size:29px}
 .arena{grid-template-columns:1fr}
 .battlefield{min-width:0}
 .battlefield .beds{gap:5px}
 .bed-cell>.combat-card{height:auto;min-height:164px}
 .combat-card{padding:8px 3px;overflow:hidden}
 .combat-card .creature{width:min(75px,22vw);height:min(75px,22vw)}
 .combat-card strong{font-size:13px;line-height:1.18;overflow-wrap:anywhere}
 .combat-card small{font-size:10px}
 .combat-card .statuses{min-height:20px}
 .combat-card .statuses b{font-size:9px}
 .bed{min-height:120px;padding:7px 3px}
 .bed .creature{width:min(70px,22vw);height:min(70px,22vw)}
 .bed strong{font-size:12px;overflow-wrap:anywhere}
 .collection-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .collection-card{min-width:0;flex-direction:column;align-items:center;text-align:center;padding:11px 5px}
 .collection-card>.creature{height:64px;width:64px}
 .collection-card strong{font-size:13px;overflow-wrap:anywhere}
 .collection-card small{font-size:10px}
 .collection-card>div{width:100%;text-align:left}
 .collection-card>div button,.collection-card>div select{width:100%;margin-top:5px}
 .collection-card>div .creature{margin:auto}
 .collection-card h3{font-size:18px}
 .collection-card p{font-size:11px}
 .creature-detail{order:-1}
 .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
 .filters button{white-space:nowrap;flex:0 0 auto;min-height:44px;font-size:12px;padding:9px 12px}
 .encounter{min-height:67px;padding:11px}
 .encounter strong{font-size:16px}
 .encounter small{font-size:12px}
 .log{height:200px}
 .vine-attachment button{min-height:44px;font-size:12px}
 footer{padding-bottom:max(24px,env(safe-area-inset-bottom))}
}
@media(max-width:360px){
 .shell{padding:0 8px}
 .panel{padding:10px}
 .combat-card strong{font-size:11px}
 .combat-card .creature{width:59px;height:59px}
 .collection-card small{font-size:9px}
}

rong></p><button class="primary" data-action="campaign-start" ${save.stage>save.completed.length?'disabled':''}>Fight selected campaign stage</button></section><section class="panel collection"><h2>Your collection & upgrades</h2><div class="collection-grid">${D.cards.map(c=>{const owned=save.owned.includes(c.id),rarity=D.rarityOf(c.id),recruitCost={common:30,rare:60,epic:90}[rarity],fragmentCost={common:4,rare:6,epic:8}[rarity],level=save.levels[c.id]||1,asc=save.ascensions[c.id]||1,stars=save.stars[c.id]||1,cost=20*level,evolveCost=100*stars,canEvolve=owned&&stars<3&&level>=stars*5;return `<div class="collection-card" style="--faction:${D.factions[c.faction].color}">${art(c)}<div><strong>${c.name}</strong><p>${D.rarityOf(c.id).toUpperCase()} · ${owned?'Owned · Level '+level+' · '+stars+'★ · Asc '+asc:'Unowned · '+(save.fragments[c.id]||0)+' fragments'}</p><small>${save.equipment[c.id]?D.relics[save.equipment[c.id]].name:'No relic equipped'}</small><small>${owned?'+'+(level-1)+' HP and attack from levels':'Recruit to use in campaign'}</small><button data-action="${owned?'upgrade':'recruit'}" data-value="${c.id}" ${save.seeds<(owned?cost:recruitCost)||owned&&level>=20?'disabled':''}>${owned?'Level up · '+cost+' Seeds':'Recruit · '+recruitCost+' Seeds'}</button>${!owned?`<button data-action="fragment-recruit" data-value="${c.id}" ${(save.fragments[c.id]||0)<fragmentCost?'disabled':''}>Recruit · ${fragmentCost} fragments</button>`:''}${owned?`<button data-action="ascend" data-value="${c.id}" ${level<asc*5||asc>=3||save.essence<asc*3||((save.fragments[c.id]||0)<asc*2)?'disabled':''}>Ascend · ${asc*3} Essence + ${asc*2} fragments</button>`:''}${owned?`<label>Equip relic<select data-equip="${c.id}" aria-label="Equip relic to ${c.name}"><option value="">Unequipped</option>${save.completed.map(id=>D.chapters[D.encounters.findIndex(e=>e.id===id)]?.relic).filter(Boolean).map(id=>`<option value="${id}" ${save.equipment[c.id]===id?'selected':''}>${D.relics[id].name}</option>`). function guide(){return `<section class="intro"><div><p class="eyebrow">FIELD NOTES / FIRST GARDEN</p><h1>Not just stronger.<br><i>Stronger together.</i></h1><p>These are the first five of eight planned faction systems.</p></div></section><div class="guide-grid"><section class="panel"><p class="eyebrow">GLASSHOUSE</p><h2>Pane</h2><p>Orthogonal neighbors share one shield. Diagonals never link. Exact depletion Cracks every member; overflow hits the target and Shatters back onto the attacker.</p><p>Crack lasts through the end of the next round. Pool labels refer to the whole connected group, not each card.</p></section><section class="panel"><p class="eyebrow">VERDANT COURT</p><h2>Rings</h2><p>Start at Ring 0 with no active Ring abilities. Gain a Ring each round, up to 3. Dormant creatures may rest for one extra Ring.</p><p>Auto rests before Ring 3 unless a normal strike can kill its target. Pause and choose Rest or Attack to change that decision.</p></section><section class="panel"><p class="eyebrow">THE SWARM</p><h2>Visit / Infest</h2><p>After an attack, Visit the plant with the most Rings, or highest health if none have Rings. Give an immature Verdant one Ring; otherwise restore health.</p><p>No plants? Infest fills empty beds with temporary Aphids. Tokens never Visit or Infest by default.</p></section><section class="panel"><p class="eyebrow">BRIAR WILD</p><h2>Bind</h2><p>Vines attach to starting creatures without taking a bed. Each has its own health. Target the host or vine separately; an attack on the whole bed hits both. Host death also kills its vine.</p><p>Stake grants attack at the cost of host health. With no legal host, Briar Roots in an empty bed and stops ticking. Use the target selector to cut an enemy vine, even when it is attached to your own creature.</p></section><section class="panel"><p class="eyebrow">MYCELIUM</p><h2>Compost</h2><p>A starting Mycelium card creates a personal team pool, capped at 10. Non-token deaths on either side feed both eligible pools. Tokens generate none by default.</p><p>Spore Priest concentrates poison for 2; Capsinger heals for 3; Cordyceps Knight spends 4 on death to return once. Poison bypasses Pane. Your pool resets for every battle.</p></section></div><section class="panel"><h2>What this build includes</h2><p>Six beds and a separate commander, fixed starting auras, formation saves, five repeatable trials, seeded battles, and a readable action log. All fifteen creatures are available for experimentation.</p><p>Card stats and aura percentages are provisional. Duchess’s Ring 3 compulsion is once per battle, never forces a lone enemy to lose its turn, and does not stack multiple compulsions on the same side in one round.</p><p>The Year, Light and Rot are experimental systems in this alpha. Campaign rewards, collection progression, and production creature art are not part of this combat slice. The old sci-fi prototype and its saves remain separate.</p><p class="hint">Tip: put Glasshouse cards beside each other, then put a Swarm behind a Verdant. Watch which plant receives each Visit before deciding that a higher attack stat is better.</p></section>`;}
function render(){app.innerHTML=`<div class="shell">${header()}<main>${tab==='formation'?formation():tab==='campaign'?progression():tab==='collection'?collectionView():tab==='battle'?battleView():guide()}</main><footer>UNDERROOT KINGDOMS · ORIGINAL COMBAT ALPHA <span>${storageError?'Storage unavailable — formation will not persist':'Formation saved on this device'} · Placeholder silhouettes</span></footer></div>`;const log=app.querySelector('.log');if(log)log.scrollTop=log.scrollHeight;}

     persist();return;
   }
   const first=!save.completed.includes(id),seeds=first?40+battleEncounter*10:10;
   const bossId=D.encounters[battleEncounter].team.find(x=>catalog[x].name===D.chapters[battleEncounter].boss);
   save.seeds+=seeds;save.essence+=1;
   if(first){save.completed.push(id);save.stage=Math.min(D.encounters.length-1,battleEncounter+1);}
   if(bossId)save.fragments[bossId]=(save.fragments[bossId]||0)+2;
   if(focus)save.fragments[focus]=(save.fragments[focus]||0)+1;
   lastReward={lost:false,first,seeds,boss:bossId?catalog[bossId].name:'Boss',focus:focus?catalog[focus].name:'Ally',relic:D.relics[D.chapters[battleEncounter].relic].name};
 }else if(battle.result.winner===0&&!save.wins.includes(id))save.wins.push(id);
 persist();
}
function step(choice={}){const actor=battle?.nextActor();if(!timer&&actor?.side===0&&cultivateChoice){const [kind,target]=cultivateChoice.split(':');choice.cultivate={kind,target:target||undefined};}if(!timer&&actor?.side===0&&targetChoice&&battle.legalTargets(actor).some(u=>u.uid===targetChoice))choice.target=targetChoice;battle?.step(choice);targetChoice='';cultivateChoice='';finish();render();}
function start(campaign=false){stop();lastReward=null;targetChoice='';cultivateChoice='';campaignMode=campaign;battleEncounter=campaign?save.stage:save.encounter;if(campaign&&save.team.some(id=>!save.owned.includes(id)))return;battle=new C.Battle(D.cards,[save.team,D.encounters[battleEncounter].team],{commanders:[commanderChoice,false],boss:campaign?{id:D.encounters[battleEncounter].team.find(id=>catalog[id].name===D.chapters[battleEncounter].boss),mechanic:['bulwark','surge','surge','bulwark','spores','year','surge','rot','year'][battleEncounter],hpBonus:12+battleEncounter*3,attackBonus:1+Math.floor(battleEncounter/3)}:null});if(campaign)for(const u of battle.units.filter(u=>u.starting&&u.originalSide===0)){const boost=(save.levels[u.id]||1)-1;const starBonus=(save.stars[u.id]||1)-1,ascBonus=(save.ascensions[u.id]||1)-1;u.maxHp+=boost+starBonus*5+ascBonus*4;u.hp+=boost+starBonus*5+ascBonus*4;u.attack+=boost+starBonus*2+ascBonus*2;const relic=D.relics[save.equipment[u.id]];if(relic){u.hp+=relic.hp;u.maxHp+=relic.hp;u.attack+=relic.attack;if(relic.trait==='guard')u.personalShield=(u.personalShield||0)+5;if(relic.trait==='swift')u.speed+=2;if(relic.trait==='poison')u.poisonOnHit=(u.poisonOnHit||0)+1;if(relic.trait==='resistRot')u.rotResist=true;}}tab='battle';resultSaved=false;render();}
app.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;e.preventDefault();const {action,value}=button.dataset;
if(action==='tab'){stop();tab=value;}
if(action==='bed')selected=Number(value);
if(action==='commander')commanderChoice=!commanderChoice;
if(action==='hold'||action==='hasten'){battle.orderCalendar(0,action==='hold'?'Hold':'Hasten');render();return;}
if(action==='filter')filter=value;
if(action==='collection-filter'){collectionFilter=value;focusedCreature=null;}
if(action==='collection-ownership'){collectionOwnership=value;focusedCreature=null;}
if(action==='inspect'&&catalog[value])focusedCreature=value;
if(action==='assign'){save.team[selected]=value;persist();}
if(action==='encounter'){save.encounter=Number(value);persist();}
if(action==='start'){start(false);return;}
if(action==='campaign-start'){start(true);return;}
if(action==='starter'&&!save.starterClaimed){save.seeds+=90;save.starterClaimed=true;persist();}
if(action==='stage'){const i=Number(value);if(i<=save.completed.length){save.stage=i;persist();}}
if(action==='ascend'&&save.owned.includes(value)){const lv=save.levels[value]||1,n=save.ascensions[value]||1;if(n<3&&lv>=n*5&&save.essence>=n*3&&(save.fragments[value]||0)>=n*2){save.essence-=n*3;save.fragments[value]-=n*2;save.ascensions[value]=n+1;persist();}}
if(action==='recruit'&&catalog[value]&&!save.owned.includes(value)){const cost={common:30,rare:60,epic:90}[D.rarityOf(value)];if(save.seeds>=cost){save.seeds-=cost;save.owned.push(value);persist();}}
if(action==='fragment-recruit'&&catalog[value]&&!save.owned.includes(value)){const cost={common:4,rare:6,epic:8}[D.rarityOf(value)];if((save.fragments[value]||0)>=cost){save.fragments[value]-=cost;save.owned.push(value);persist();}}
if(action==='evolve'&&save.owned.includes(value)){const level=save.levels[value]||1,stars=save.stars[value]||1;if(stars<3&&level>=stars*5&&save.seeds>=100*stars){save.seeds-=100*stars;save.stars[value]=stars+1;persist();}}
if(action==='upgrade'&&save.owned.includes(value)){const level=save.levels[value]||1;if(level<20&&save.seeds>=20*level){save.seeds-=20*level;save.levels[value]=level+1;persist();}}

if(action==='target')targetChoice=value;
if(action==='step'){step();return;}
if(action==='rest'){step({rest:true});return;}
if(action==='attack'){step({rest:false});return;}
if(action==='edit'){stop();tab='formation';}
if(action==='auto'){if(timer)stop();else if(battle&&!battle.result)timer=setInterval(()=>step(),speed);}
render();
});
app.addEventListener('change',e=>{if(e.target.id==='target'){targetChoice=e.target.value;render();}if(e.target.id==='cultivate')cultivateChoice=e.target.value;if(e.target.dataset?.equip){const id=e.target.dataset.equip,relic=e.target.value;const earned=save.completed.some(stage=>D.chapters[D.encounters.findIndex(e=>e.id===stage)]?.relic===relic);if(save.owned.includes(id)&&(!relic||earned)){if(relic)save.equipment[id]=relic;else delete save.equipment[id];persist();render();}}if(e.target.id==='preset'&&D.presets[e.target.value]){save.team=[...D.presets[e.target.value]];persist();render();}if(e.target.id==='speed'){speed=Number(e.target.value);if(timer){stop();timer=setInterval(()=>step(),speed);}render();}});
render();
})();

</script></body></html>
