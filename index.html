/* Mobile-first interface pass: larger controls, scrollable navigation, readable combat cards. */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
button,select{touch-action:manipulation}
button:active:not(:disabled){transform:scale(.985)}
nav{position:relative;min-width:0}

.campaign-path{position:relative}

.campaign-path .encounter.selected{box-shadow:inset 3px 0 var(--gold)}

  const mission=data.missions[chapter]?.[act];
  if(!mission)throw Error('Unknown campaign mission');
  const enc=data.encounters[chapter],bossId=enc.team.find(id=>data.cards.find(c=>c.id===id)?.name===data.chapters[chapter].boss);

    {id:bossId,mechanic:['bulwark','surge','surge','bulwark','spores','year','surge','rot','year'][chapter],
     hpBonus:12+chapter*3,attackBonus:1+Math.floor(chapter/3)}:null};
}
function applyProgression(battle,save,data){
  for(const u of battle.units.filter(u=>u.starting&&u.originalSide===0)){
    const level=Math.max(0,(save.levels?.[u.id]||1)-1),
      stars=Math.max(0,(save.stars?.[u.id]||1)-1),
      asc=Math.max(0,(save.ascensions?.[u.id]||1)-1);
    const hp=level+stars*5+asc*4,attack=level+stars*2+asc*2;
    u.maxHp+=hp;u.hp+=hp;u.attack+=attack;
    const relic=data.relics[save.equipment?.[u.id]];
    if(relic){
      u.hp+=relic.hp;u.maxHp+=relic.hp;u.attack+=relic.attack;
      if(relic.trait==='guard')u.personalShield=(u.personalShield||0)+5;
      if(relic.trait==='swift')u.speed+=2;
      if(relic.trait==='poison')u.poisonOnHit=(u.poisonOnHit||0)+1;
      if(relic.trait==='resistRot')u.rotResist=true;
    }
  }
  return battle;
}

    survivors=party.filter(u=>u.hp>0&&!u.removed&&u.owner===0).length,
    vitality=party.reduce((n,u)=>n+(u.hp>0&&u.owner===0?u.hp/Math.max(1,u.maxHp):0),0),
    enemy=battle.units.filter(u=>u.starting&&u.originalSide===1),
    enemyVitality=enemy.reduce((n,u)=>n+(u.hp>0&&u.owner===1?u.hp/Math.max(1,u.maxHp):0),0),
    win=battle.result?.winner===0,
    rounds=battle.round;

/* Compact roster dossier calculations intentionally mirror campaign stat boosts. */
function creatureStats(c){
 const lv=(save.levels[c.id]||1)-1,star=(save.stars[c.id]||1)-1,asc=(save.ascensions[c.id]||1)-1,r=D.relics[save.equipment[c.id]]||{};
 return {hp:c.hp+lv+star*5+asc*4+(r.hp||0),attack:c.attack+lv+star*2+asc*2+(r.attack||0),speed:c.speed+(r.trait==='swift'?2:0)};
}
function creatureRole(c){
 const roles={hedge:'Pane Guardian',cloche:'Sheltered Survivor',rose:'Protected Striker',oak:'Thorn Sentinel',duchess:'Bloom Enchanter',moss:'Root Healer',queen:'Swarm Matriarch',shears:'Visit Duelist',bindweed:'Host Parasite',stake:'Bound Support',seedbomb:'Bed Saboteur',spore:'Poison Alchemist',cordyceps:'Compost Revenant',capsinger:'Compost Healer',frost:'Season Warden',cloudburst:'Weather Spirit',drought:'Summer Harbinger',lantern:'Light Keeper',solstice:'Dawn Executioner',acre:'Rot Herald',seedone:'Blight Cultivator',ladybird:'Swift Duelist'};
 return roles[c.id]||'Garden Creature';
}

 <div class="profile-art">${cardFrame(c)}<div><p class="eyebrow">${rarity.toUpperCase()} · ${escape(D.factions[c.faction].name)}</p><h2>${escape(c.name)}</h2><span class="role-tag">${escape(creatureRole(c))}</span></div></div>
 <p class="portrait-credit">ILLUSTRATED BESTIARY · ${escape(creatureRole(c))}</p><p class="profile-lore">${escape(c.lore||'')}</p>
 <div class="profile-ability"><strong>${escape(D.factions[c.faction].keyword)}</strong><p>${escape(c.text||'')}</p></div>

 <p class="profile-inventory">${save.fragments[c.id]||0} fragments · ${save.equipment[c.id]?'Equipped: '+escape(D.relics[save.equipment[c.id]].name):'No relic equipped'}</p>

/* Render-only health delta: no battle state mutation or animation-driven turns. */

const cueLabels={hit:'STRIKE',crit:'CRITICAL',shatter:'PANE SHATTER',ring:'RING GROWTH',heal:'RESTORE',rot:'BLIGHT ROT',overtake:'OVERTAKE',compost:'COMPOST',spend:'COMPOST SPENT',visit:'SWARM VISIT',infest:'INFEST',death:'FALLEN',revive:'RETURN',season:'THE YEAR',cultivate:'CULTIVATE',bind:'BIND',bindtick:'VINE STRIKE',poison:'POISON',boss:'BOSS AWAKENS',solstice:'DAWN EXECUTION',bloom:'NIGHT BLOOM'};
const cueSymbols={hit:'✦',crit:'✷',shatter:'◇',ring:'❋',heal:'✚',rot:'☣',overtake:'✢',compost:'✣',spend:'✣',visit:'✧',infest:'✶',death:'✕',revive:'↥',season:'✴',cultivate:'☼',bind:'❧',bindtick:'❧',poison:'☣',boss:'♛',solstice:'☼',bloom:'❀'};
const cueRole=u=>combatCue?.actor===u.uid?'cue-actor':combatCue?.targets?.includes(u.uid)?'cue-target':'';

function sceneCue(u){
 const change=combatCue?.changes.find(item=>item.uid===u.uid);
 const number=change?`<span class="floating-number ${change.delta>0?'cue-heal':'cue-damage'}" aria-label="${change.delta>0?'Healed':'Damaged'} ${Math.abs(change.delta)} health">${change.delta>0?'+':'−'}${Math.abs(change.delta)}</span>`:'';
 const glyph=combatCue?.targets?.includes(u.uid)?`<span class="effect-glyph" aria-hidden="true">${cueSymbols[combatCue.tone]||'✦'}</span>`:'';
 return number+glyph;
}

function unitView(u,bed){
if(!u)return `<div class="combat-card empty"><span>${bed<3?'FRONT':'BACK'} ${bed%3+1}</span><p>Empty bed</p></div>`;
const p=battle.pane(u),actor=battle.nextActor(),dead=!C.alive(u),c=catalog[u.id]||u;
return `<div class="combat-card ${dead?'fallen':''} ${u.absent?'absent':''} ${actor===u?'acting':''} ${cueRole(u)}" style="--faction:${D.factions[u.faction]?.color||'#aaa'}"><span class="bed-number">${bed<3?'F':'B'}${bed%3+1}</span>${art(c,true)}<strong>${u.name}</strong><div class="health" role="meter" aria-label="${u.name} health" aria-valuemin="0" aria-valuemax="${u.maxHp}" aria-valuenow="${u.hp}"><i style="width:${100*u.hp/u.maxHp}%"></i></div><small>${u.hp} / ${u.maxHp} HP · ${battle.attackValue(u)} ATK</small><div class="statuses">${u.light?`<b>LIGHT ${u.light}/3</b>`:''}${u.rot?`<b>ROT ${u.rot}/3</b>`:''}${u.puppet?'<b>OVERTAKEN PUPPET</b>':''}${dead?'FALLEN':u.absent?'SHELTERED':u.faction==='glass'?u.crackUntil?`CRACKED → R${u.crackUntil}`:`PANE ${p?.pool||0} / ${p?.cap||0}`:u.faction==='verdant'?`RINGS ${'●'.repeat(u.rings)}${'○'.repeat(3-u.rings)}`:u.faction==='briar'?'ROOTED · no ticks':u.faction==='mycelium'?'COMPOST':u.token?'APHID · temporary':'VISIT / INFEST'}${u.doubleNext?'<b>DOUBLE STRIKE</b>':''}${battle.poisonTotal(u)?`<b>POISON ${battle.poisonTotal(u)}</b>`:''}</div>${sceneCue(u)}</div>`;
}
function attachment(host){const vine=battle.vineOn(host);if(!vine)return '';const actor=battle.nextActor(),canTarget=!timer&&!battle.result&&actor?.side===0&&battle.legalTargets(actor).includes(vine);return `<div class="vine-attachment"><strong>${vine.side===0?'Your':'Rival'} ${vine.name}</strong><small>${vine.hp}/${vine.maxHp} HP · ${vine.staked?'Stake +'+vine.stakeAttack+' ATK':'enemy Bind'}${battle.poisonTotal(vine)?' · poison '+battle.poisonTotal(vine):''}</small><button data-action="target" data-value="${vine.uid}" ${canTarget?'':'disabled'}>${targetChoice===vine.uid?'Selected':'Target vine'}</button></div>`;}
function board(side){const cmd=battle.units.find(u=>u.commander&&u.side===side);return `<section class="panel battlefield"><div class="section-heading"><h2>${side===0?'Your garden':'The rival garden'}</h2><span class="tag">${battle.auras[side].name}</span></div><div class="commander ${battle.combatants(side).length?'':'exposed'}"><span>✧</span><div><strong>${cmd.name} · ${cmd.hp} / ${cmd.maxHp}</strong><small>${battle.combatants(side).length?'Protected by surviving combatants':'Exposed — defeat the commander to win'}</small></div></div><div class="compost-pool">${battle.compost[side]===null?'No Compost pool · no starting Mycelium':`Compost <strong>${battle.compost[side]} / 10</strong>`}</div>${battle.pendingRevives.filter(r=>battle.unit(r.uid).side===side).map(r=>`<p class="hint">${battle.unit(r.uid).name} returns round ${r.round}</p>`).join('')}<div class="row-label">FRONT ROW</div><div class="beds">${[0,1,2,3,4,5].map(bed=>{const residents=battle.units.filter(u=>u.owner===side&&u.bed===bed);const host=residents.find(C.alive)||residents.at(-1);return `<div class="bed-cell">${unitView(host,bed)}${host?attachment(host):''}</div>`;}).join('')}</div><div class="row-label back">BACK ROW</div>${battle.panes.filter(p=>battle.unit(p.ids[0]).side===side).map(p=>`<div class="pane-summary"><span>◇ Shared Pane ${p.pool}/${p.cap}</span><small>${p.ids.map(id=>{const b=battle.unit(id).bed;return `${b<3?'F':'B'}${b%3+1}`;}).join(' ↔ ')}</small></div>`).join('')}</section>`;}
function compactUnit(u,bed,side){
 if(!u)return `<div class="mini-unit empty"><span class="mini-slot">${bed<3?'F':'B'}${bed%3+1}</span><small>Empty</small></div>`;
 const dead=!C.alive(u),c=catalog[u.id]||u,actor=battle.nextActor(),targetable=!timer&&!battle.result&&actor?.side===0&&battle.legalTargets(actor).includes(u);
 const hp=Math.max(0,Math.round(100*u.hp/u.maxHp));
 const pane=battle.pane(u),status=dead?'Fallen':u.rot?'Rot '+u.rot:u.light?'Light '+u.light:u.crackUntil?'Cracked':pane?'Pane '+pane.pool:u.rings?'Ring '+u.rings:'';
 return `<button class="mini-unit rarity-${D.rarityOf(u.id)} ${dead?'fallen':''} ${actor===u?'acting':''} ${targetChoice===u.uid?'target-selected':''} ${cueRole(u)}" style="--faction:${D.factions[u.faction]?.color||'#aaa'}" data-action="${targetable?'mini-target':'noop'}" data-value="${u.uid}" ${targetable?'':'disabled'} aria-label="${escape(u.name)} ${u.hp} of ${u.maxHp} health${targetable?', tap to target':''}">
 <span class="mini-slot">${bed<3?'F':'B'}${bed%3+1}</span>${cardFrame(c,true)}
 <strong>${escape(u.name)}</strong><div class="mini-health"><i style="width:${hp}%"></i></div><small>${u.hp}/${u.maxHp} HP</small><em>${status||'·'}</em>${sceneCue(u)}</button>`;
}
function compactSide(side){
 const cmd=battle.units.find(u=>u.commander&&u.side===side);
 const cards=[0,1,2,3,4,5].map(bed=>{
  const units=battle.units.filter(u=>u.owner===side&&u.bed===bed);
  return compactUnit(units.find(C.alive)||units.at(-1),bed,side);
 }).join('');
 return `<section class="mini-side ${side===1?'enemy-side':'ally-side'}" aria-label="${side===0?'Your':'Enemy'} team"><div class="mini-side-header"><strong>${side===0?'YOUR GARDEN':'RIVAL GARDEN'}</strong><span>✧ ${cmd.hp}/${cmd.maxHp} Commander</span></div><div class="mini-grid">${cards}</div></section>`;
}
function mobileBattlefield(){
 const actor=battle.nextActor(),recent=battle.events.slice(-1)[0];const eventTone=combatCue?.tone||'normal';
 return `<section class="mobile-battle-scene" style="--action-time:${Math.max(150,Math.min(speed,720))}ms" aria-label="Compact battlefield with both teams"><div class="scene-header"><strong>⚔ ROUND ${battle.round}</strong><span>THE YEAR · ${battle.season}</span></div>
 ${compactSide(1)}<div class="scene-divider feedback-${eventTone}" role="status" aria-live="polite"><span class="scene-rune">${cueSymbols[eventTone]||'✦'}</span><div class="scene-message"><b>${cueLabels[eventTone]||'THE GARDEN STIRS'}</b><small>${escape(combatCue?.text||recent?.text||'The garden stirs')}</small></div></div>${compactSide(0)}
 <div class="mobile-quick-actions"><button class="primary" data-action="auto" ${battle.result?'disabled':''}>${timer?'Ⅱ Pause':'▶ Auto Battle'}</button><button data-action="step" ${timer||battle.result?'disabled':''}>Next action →</button></div>
 <p class="scene-hint">${targetChoice?'Target selected · next action':'Tap a rival creature to select your next attack target.'}</p></section>`;
}
function battleView(){if(!battle)return `<section class="panel empty-state"><p class="eyebrow">THE GARDEN IS QUIET</p><h1>Your creatures await.</h1><p>Choose a formation and enter a trial to begin.</p><button class="primary" data-action="tab" data-value="formation">Build your formation →</button></section>`;
const actor=battle.nextActor(),done=battle.result,win=done?.winner===0;
const canCultivate=!timer&&!done&&actor?.side===0&&actor.cultivate;
const lightAtAction=canCultivate?Math.min(3,actor.light+(battle.shaded(actor)?0:1)):0;
const cultivateChoices=canCultivate?battle.lightOptions(actor,lightAtAction):[];
const outcome=done?`<section class="battle-result ${win?'victorious':'defeated'}" role="status"><span>${win?'✦':'◈'}</span><div><strong>${win?'VICTORY':done.winner===null?'STALEMATE':'DEFEAT'}</strong><small>${win?'Your garden grows stronger.':'The roots endure. Your next attempt can be stronger.'}</small></div></section>`:'';
const reward=done&&campaignMode&&lastReward?`<section class="panel victory-rewards"><p class="eyebrow">CAMPAIGN REWARDS</p><h2>${lastReward.lost?'Training progress':lastReward.first?'First clear':'Repeat victory'}</h2><p>+${lastReward.seeds} Seeds ${lastReward.lost?'· +1 '+escape(lastReward.focus)+' fragment':'· +1 Essence · +2 '+escape(lastReward.boss)+' fragments · +1 '+escape(lastReward.focus)+' fragment'}</p>${lastReward.first&&!lastReward.lost&&lastReward.relic?`<p>Relic unlocked: ${escape(lastReward.relic)}</p>`:''}${lastReward.lost?'<p>Even defeats build your collection. Recruit another creature or level up an ally, then try again.</p>':''}<button class="primary" data-action="tab" data-value="collection">Recruit or strengthen creatures →</button><button data-action="tab" data-value="campaign">Back to campaign</button></section>`:'';
return `<section class="battle-heading"><div><p class="eyebrow">${D.encounters[battleEncounter].name} · ROUND ${battle.round}</p><h1>${done?(done.winner===null?'A garden at stalemate':win?'The garden is yours.':'The roots remember.'):timer?'The garden awakens.':'Read the battlefield.'}</h1><p>${done?(win?'Your commander stands. Try a new formation or the next trial.':'Adjust your formation, then return to the garden.'):actor?`Next: ${actor.name} · ${actor.side===0?'your creature':'rival creature'}`:'Round-end growth and recovery are next.'}</p></div><div class="controls"><span class="tag">THE YEAR · ${battle.season}</span>${battle.units.find(u=>u.commander&&u.side===0)?.seasonsCommander?`<button data-action="hold" ${timer||done||battle.calendarUsed[0]||actor?.side!==0?'disabled':''}>Hold Year</button><button data-action="hasten" ${timer||done||battle.calendarUsed[0]||actor?.side!==0?'disabled':''}>Hasten Year</button>`:''}<label class="target-picker">Attack target<select id="target" aria-label="Attack target" ${timer||done||actor?.side!==0?'disabled':''}><option value="">Automatic target</option>${actor?.side===0?battle.legalTargets(actor).map(u=>`<option value="${u.uid}" ${targetChoice===u.uid?'selected':''}>${u.name}${u.hostId?' · vine on '+battle.unit(u.hostId).name:u.commander?' · commander':' · bed '+(u.bed+1)}</option>`).join(''):''}</select></label>${cultivateChoices.length?`<label class="target-picker">Cultivate<select id="cultivate" aria-label="Choose Cultivate effect"><option value="">Automatic Light choice</option>${cultivateChoices.map(o=>`<option value="${o.kind}:${o.target||''}">${o.kind} ${o.target?battle.unit(o.target).name:''}</option>`).join('')}</select></label>`:''}<button data-action="auto" ${done?'disabled':''}>${timer?'Pause':'Auto battle'}</button><button data-action="step" ${done||timer?'disabled':''}>Next action</button><button data-action="rest" ${done||timer||!actor?.dormant||actor.side!==0?'disabled':''}>Rest</button><button data-action="attack" ${done||timer||!actor?.dormant||actor.side!==0?'disabled':''}>Attack</button><select id="speed" aria-label="Battle playback speed"><option value="1000" ${speed===1000?'selected':''}>Slow</option><option value="650" ${speed===650?'selected':''}>Normal</option><option value="180" ${speed===180?'selected':''}>Fast</option></select><button data-action="edit">Edit formation</button>${done?'<button class="primary" data-action="start">Battle again →</button>':''}</div></section>${outcome}${reward}${mobileBattlefield()}<div class="arena legacy-arena">${board(0)}${board(1)}</div><section class="panel chronicle"><div class="section-heading"><div><p class="eyebrow">WATCH THE RELATIONSHIPS</p><h2>Battle chronicle</h2></div><span class="tag">${timer?'Running':done?'Complete':'Paused'} · seed 42</span></div><div class="log" tabindex="0" aria-label="Battle chronicle">${battle.events.slice(-90).map(e=>`<p class="event ${e.type}"><span>R${e.round}</span>${escape(e.text)}</p>`).join('')}</div></section>`;
}
function guide(){return `<section class="intro"><div><p class="eyebrow">FIELD NOTES / FIRST GARDEN</p><h1>Not just stronger.<br><i>Stronger together.</i></h1><p>Eight ancient factions. Eight distinctive systems.</p></div></section><div class="guide-grid"><section class="panel"><p class="eyebrow">GLASSHOUSE</p><h2>Pane</h2><p>Orthogonal neighbors share one shield. Diagonals never link. Exact depletion Cracks every member; overflow hits the target and Shatters back onto the attacker.</p><p>Crack lasts through the end of the next round. Pool labels refer to the whole connected group, not each card.</p></section><section class="panel"><p class="eyebrow">VERDANT COURT</p><h2>Rings</h2><p>Start at Ring 0 with no active Ring abilities. Gain a Ring each round, up to 3. Dormant creatures may rest for one extra Ring.</p><p>Auto rests before Ring 3 unless a normal strike can kill its target. Pause and choose Rest or Attack to change that decision.</p></section><section class="panel"><p class="eyebrow">THE SWARM</p><h2>Visit / Infest</h2><p>After an attack, Visit the plant with the most Rings, or highest health if none have Rings. Give an immature Verdant one Ring; otherwise restore health.</p><p>No plants? Infest fills empty beds with temporary Aphids. Tokens never Visit or Infest by default.</p></section><section class="panel"><p class="eyebrow">BRIAR WILD</p><h2>Bind</h2><p>Vines attach to starting creatures without taking a bed. Each has its own health. Target the host or vine separately; an attack on the whole bed hits both. Host death also kills its vine.</p><p>Stake grants attack at the cost of host health. With no legal host, Briar Roots in an empty bed and stops ticking. Use the target selector to cut an enemy vine, even when it is attached to your own creature.</p></section><section class="panel"><p class="eyebrow">MYCELIUM</p><h2>Compost</h2><p>A starting Mycelium card creates a personal team pool, capped at 10. Non-token deaths on either side feed both eligible pools. Tokens generate none by default.</p><p>Spore Priest concentrates poison for 2; Capsinger heals for 3; Cordyceps Knight spends 4 on death to return once. Poison bypasses Pane. Your pool resets for every battle.</p></section></div><section class="panel"><h2>What this build includes</h2><p>Six beds and a separate commander, fixed starting auras, formation saves, five repeatable trials, seeded battles, and a readable action log. All twenty-two creatures are available for trial formations.</p><p>Card stats and aura percentages are provisional. Duchess’s Ring 3 compulsion is once per battle, never forces a lone enemy to lose its turn, and does not stack multiple compulsions on the same side in one round.</p><p>The Year, Light and Rot are active in this alpha. Twenty-seven campaign missions, recruitment and upgrades are playable; finished painted creature illustrations remain for a later art milestone. The old sci-fi prototype and its saves remain separate.</p><p class="hint">Tip: put Glasshouse cards beside each other, then put a Swarm behind a Verdant. Watch which plant receives each Visit before deciding that a higher attack stat is better.</p></section>`;}
function render(){app.innerHTML=`<div class="shell">${header()}<main>${tab==='home'?homeView():tab==='formation'?formation():tab==='campaign'?progression():tab==='collection'?collectionView():tab==='battle'?battleView():guide()}</main><footer>UNDERROOT KINGDOMS · ORIGINAL MOBILE ALPHA <span>${storageError?'Storage unavailable — formation will not persist':'Formation saved on this device'} · Prototype vector portraits</span></footer></div>`;const log=app.querySelector('.log');if(log)log.scrollTop=log.scrollHeight;}
function stop(){clearInterval(timer);timer=null;}
function finish(){
 if(!battle?.result||resultSaved)return;
 stop();resultSaved=true;
 const id=D.encounters[battleEncounter].id;
 if(campaignMode){
   const focus=save.team[0],mission=D.missions[battleEncounter][battleMission];
   if(battle.result.winner!==0){
     save.seeds+=12;
     if(focus)save.fragments[focus]=(save.fragments[focus]||0)+1;
     lastReward={lost:true,first:false,seeds:12,boss:'',focus:focus?catalog[focus].name:'Ally',relic:''};
     persist();return;
   }
   const first=!save.missionClears.includes(mission.id),seeds=first?mission.firstSeeds:10;
   const bossId=D.encounters[battleEncounter].team.find(x=>catalog[x].name===D.chapters[battleEncounter].boss);
   save.seeds+=seeds;save.essence+=1;
   if(first){
     save.missionClears.push(mission.id);
     if(mission.boss){
       if(!save.completed.includes(id))save.completed.push(id);
       if(save.stage===battleEncounter){save.stage=Math.min(D.encounters.length-1,battleEncounter+1);save.mission=0;}
     }else if(save.stage===battleEncounter){save.mission=Math.min(2,battleMission+1);}
   }
   if(bossId&&mission.boss)save.fragments[bossId]=(save.fragments[bossId]||0)+2;
   if(focus)save.fragments[focus]=(save.fragments[focus]||0)+1;
   lastReward={lost:false,first,seeds,boss:mission.boss&&bossId?catalog[bossId].name:'Scout',focus:focus?catalog[focus].name:'Ally',relic:mission.boss?D.relics[D.chapters[battleEncounter].relic].name:''};
 }else if(battle.result.winner===0&&!save.wins.includes(id))save.wins.push(id);
 persist();
}
function step(choice={}){const previous=battle?.units.map(u=>[u.uid,u.hp])||[],eventStart=battle?.events.length||0;const actor=battle?.nextActor();if(!timer&&actor?.side===0&&cultivateChoice){const [kind,target]=cultivateChoice.split(':');choice.cultivate={kind,target:target||undefined};}if(!timer&&actor?.side===0&&targetChoice&&battle.legalTargets(actor).some(u=>u.uid===targetChoice))choice.target=targetChoice;battle?.step(choice);const before=new Map(previous),events=battle?battle.events.slice(eventStart):[],priorities=['overtake','shatter','death','revive','ring','heal','hit','rot','cultivate','compost','visit','season'],highlight=priorities.map(type=>events.find(e=>e.type===type)).find(Boolean)||events.at(-1);combatCue={tone:highlight?.type||'normal',text:highlight?.text||'The garden stirs.',actor:actor?.uid||events.find(e=>e.actor)?.actor||null,targets:[...new Set(events.map(e=>e.target).filter(Boolean).concat(battle?battle.units.filter(u=>before.has(u.uid)&&before.get(u.uid)!==u.hp).map(u=>u.uid):[]))],changes:battle?battle.units.filter(u=>before.has(u.uid)&&before.get(u.uid)!==u.hp).map(u=>({uid:u.uid,delta:u.hp-before.get(u.uid)})):[]};targetChoice='';cultivateChoice='';finish();render();}
function start(campaign=false){stop();lastReward=null;combatCue=null;targetChoice='';cultivateChoice='';campaignMode=campaign;battleEncounter=campaign?save.stage:save.encounter;battleMission=campaign?save.mission:2;if(campaign&&save.team.some(id=>!save.owned.includes(id)))return;battle=campaign?UnderrootPlanner.createCampaignBattle(D,C,save.team,save,battleEncounter,battleMission,commanderChoice):new C.Battle(D.cards,[save.team,D.encounters[battleEncounter].team],{commanders:[commanderChoice,false]});tab='battle';resultSaved=false;render();}
app.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;e.preventDefault();const {action,value}=button.dataset;
if(action==='tab'){stop();tab=value;}
if(action==='bed')selected=Number(value);
if(action==='auto-set'){
  const result=strongestOwnedTeam();
  if(result){
    const old=save.team.slice(),oldPower=formationPower(old);
    save.team=result.team;persist();tab='formation';
    const added=[...new Set(result.team)].filter(id=>!old.includes(id));
    autoSetNotice=`${result.power} estimated power (previously ${oldPower}). ${added.length?'Added: '+added.map(id=>catalog[id].name).join(', ')+'.':'Your current team already has the highest estimated power.'} You can still adjust individual beds.`;
  }else autoSetNotice='You need six owned creatures to auto-build a full formation.';
  render();return;
}
if(action==='commander')commanderChoice=!commanderChoice;
if(action==='hold'||action==='hasten'){battle.orderCalendar(0,action==='hold'?'Hold':'Hasten');render();return;}
if(action==='filter')filter=value;
if(action==='collection-filter'){collectionFilter=value;focusedCreature=null;}
if(action==='collection-ownership'){collectionOwnership=value;focusedCreature=null;}
if(action==='inspect'&&catalog[value])focusedCreature=value;
if(action==='assign'){save.team[selected]=value;persist();}
if(action==='encounter'){save.encounter=Number(value);persist();}
if(action==='start'){start(false);return;}
if(action==='campaign-start'){start(true);return;}
if(action==='starter'&&!save.starterClaimed){save.seeds+=90;save.starterClaimed=true;persist();}
if(action==='stage'){const i=Number(value);if(i>=0&&i<D.missions.length&&i<=save.completed.length){save.stage=i;const cleared=D.missions[i].filter(m=>save.missionClears.includes(m.id)).length;save.mission=Math.min(2,cleared);persist();}}
if(action==='mission'){const i=Number(value);if(i>=0&&i<3&&i<=D.missions[save.stage].filter(m=>save.missionClears.includes(m.id)).length){save.mission=i;persist();}}
if(action==='ascend'&&save.owned.includes(value)){const lv=save.levels[value]||1,n=save.ascensions[value]||1;if(n<3&&lv>=n*5&&save.essence>=n*3&&(save.fragments[value]||0)>=n*2){save.essence-=n*3;save.fragments[value]-=n*2;save.ascensions[value]=n+1;persist();}}
if(action==='recruit'&&catalog[value]&&!save.owned.includes(value)){const cost={common:30,rare:60,epic:90}[D.rarityOf(value)];if(save.seeds>=cost){save.seeds-=cost;save.owned.push(value);persist();}}
if(action==='fragment-recruit'&&catalog[value]&&!save.owned.includes(value)){const cost={common:4,rare:6,epic:8}[D.rarityOf(value)];if((save.fragments[value]||0)>=cost){save.fragments[value]-=cost;save.owned.push(value);persist();}}
if(action==='evolve'&&save.owned.includes(value)){const level=save.levels[value]||1,stars=save.stars[value]||1;if(stars<3&&level>=stars*5&&save.seeds>=100*stars){save.seeds-=100*stars;save.stars[value]=stars+1;persist();}}
if(action==='upgrade'&&save.owned.includes(value)){const level=save.levels[value]||1;if(level<20&&save.seeds>=20*level){save.seeds-=20*level;save.levels[value]=level+1;persist();}}

if(action==='mini-target')targetChoice=value;
if(action==='target')targetChoice=value;
if(action==='step'){step();return;}
if(action==='rest'){step({rest:true});return;}
if(action==='attack'){step({rest:false});return;}
if(action==='edit'){stop();tab='formation';}
if(action==='auto'){if(timer)stop();else if(battle&&!battle.result)timer=setInterval(()=>step(),speed);}
render();
});
app.addEventListener('change',e=>{if(e.target.id==='target'){targetChoice=e.target.value;render();}if(e.target.id==='cultivate')cultivateChoice=e.target.value;if(e.target.dataset?.equip){const id=e.target.dataset.equip,relic=e.target.value;const earned=save.completed.some(stage=>D.chapters[D.encounters.findIndex(e=>e.id===stage)]?.relic===relic);if(save.owned.includes(id)&&(!relic||earned)){if(relic)save.equipment[id]=relic;else delete save.equipment[id];persist();render();}}if(e.target.id==='preset'&&D.presets[e.target.value]){save.team=[...D.presets[e.target.value]];persist();render();}if(e.target.id==='speed'){speed=Number(e.target.value);if(timer){stop();timer=setInterval(()=>step(),speed);}render();}});
render();
})();

</script></body></html>
